name: ScamSentry Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-github-actions-annotate-failures

      - name: Run Linting (Ruff)
        run: |
          ruff check app/

      - name: Check Formatting (Ruff)
        run: |
          ruff format --check app/ || echo "Formatting differences detected, non-blocking"

      - name: Run Test Suite
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379"
          API_SECRET_KEY: "test-jwt-signing-key-12345"
          ADMIN_API_KEY: "test-admin-bootstrap-key"
          ENVIRONMENT: "development"
        run: |
          pytest tests/ --ignore=tests/manual -v --asyncio-mode=auto
